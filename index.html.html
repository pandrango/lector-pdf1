<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6b72">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lector PDF">
<title>Lector de PDF en voz alta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef2f4;
    --surface: #ffffff;
    --ink: #14262e;
    --muted: #5b6e77;
    --line: #cfdadf;
    --accent: #0b6b72;
    --accent-ink: #ffffff;
    --mark: #ffe27a;
    --mark-ink: #14262e;
    --danger: #a3332b;
    --ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    --read: "Literata", Georgia, "Times New Roman", serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1a1f; --surface: #15262d; --ink: #e6eef1; --muted: #93a8b1;
      --line: #28404a; --accent: #4cc3cb; --accent-ink: #062226;
      --mark: #8a6d00; --mark-ink: #fff6d6; --danger: #ff8d84;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1a1f; --surface: #15262d; --ink: #e6eef1; --muted: #93a8b1;
    --line: #28404a; --accent: #4cc3cb; --accent-ink: #062226;
    --mark: #8a6d00; --mark-ink: #fff6d6; --danger: #ff8d84;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--ui); line-height: 1.5; min-height: 100vh;
  }
  button, select, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  header {
    max-width: 760px; margin: 0 auto; padding: 20px 16px 8px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  h1 { font-size: 1.25rem; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
  .ghost {
    background: none; border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 12px; cursor: pointer; color: var(--muted);
  }

  main { max-width: 760px; margin: 0 auto; padding: 8px 16px 220px; }

  /* Zona de carga */
  .drop {
    border: 2px dashed var(--line); border-radius: 14px; padding: 40px 20px;
    text-align: center; background: var(--surface); transition: border-color .15s, background .15s;
  }
  .drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
  .drop p { margin: 0 0 16px; color: var(--muted); }
  .drop strong { color: var(--ink); font-size: 1.1rem; display: block; margin-bottom: 4px; }
  .btn {
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px;
    padding: 12px 22px; font-weight: 700; cursor: pointer;
  }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  .status { margin: 14px 0 0; font-size: .95rem; color: var(--muted); min-height: 1.4em; }
  .status.err { color: var(--danger); }

  /* Documento */
  .docbar {
    display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between;
    gap: 6px 16px; margin: 8px 0 12px;
  }
  .docname { font-weight: 700; overflow-wrap: anywhere; }
  .pageinfo { color: var(--muted); font-size: .9rem; }

  article {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 24px 22px; font-family: var(--read); font-size: 1.1875rem; line-height: 1.75;
    max-width: 100%;
  }
  article p { margin: 0 0 1.1em; max-width: 68ch; }
  article p:last-child { margin-bottom: 0; }
  .s { cursor: pointer; border-radius: 3px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .s:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .s.now { background: var(--mark); color: var(--mark-ink); }
  .empty { font-family: var(--ui); font-size: 1rem; color: var(--muted); }

  .stats {
    display: flex; gap: 12px; margin: 0 0 12px;
  }
  .stat {
    flex: 1; background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 14px; min-width: 0;
  }
  .stat .k { display: block; font-size: .8rem; color: var(--muted); }
  .stat .v { font-size: 1.5rem; font-weight: 700; line-height: 1.2; }
  .stat .mini { height: 4px; margin-top: 6px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .stat .mini > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }

  .resume {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 8px 12px; margin: 0 0 12px; padding: 10px 14px; border-radius: 12px;
    background: color-mix(in srgb, var(--accent) 10%, var(--surface));
    border: 1px solid var(--accent); font-size: .95rem;
  }
  .resume .ghost { color: var(--ink); }

  .tools {
    position: fixed; right: calc(64px + env(safe-area-inset-right, 0px)); top: 38%; transform: translateY(-50%); z-index: 8;
    width: min(240px, calc(100vw - 84px)); max-height: 70vh; overflow-y: auto; flex-direction: column;
    display: flex; gap: 8px; margin: 0; padding: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.2);
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  }
  .tool {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 12px; cursor: pointer; font-weight: 500;
  }
  .tool:disabled { opacity: .45; cursor: not-allowed; }
  .tool[aria-expanded="true"] { border-color: var(--accent); }
  mark.ul {
    background: none; color: inherit; text-decoration: underline;
    text-decoration-color: var(--hc, var(--accent)); text-decoration-thickness: 4px;
    text-underline-offset: 5px; text-decoration-skip-ink: none;
  }
  .ulpanel {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; margin: 0; position: fixed; z-index: 9; left: 50%; transform: translateX(-50%);
    top: calc(env(safe-area-inset-top, 0px) + 56px); width: min(520px, calc(100vw - 24px));
    max-height: 60vh; overflow-y: auto; box-shadow: 0 8px 30px rgba(0,0,0,.25);
  }
  .ulpanel h2 { font-size: 1rem; margin: 0; }
  .phead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }

  :root { --c0: #e0a100; --c1: #2fa35b; --c2: #e0457b; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --c0: #ffd23f; --c1: #5fd38d; --c2: #ff7aa8; }
  }
  :root[data-theme="dark"] { --c0: #ffd23f; --c1: #5fd38d; --c2: #ff7aa8; }
  mark.ul[data-c="0"], .ulitem blockquote[data-c="0"] { --hc: var(--c0); }
  mark.ul[data-c="1"], .ulitem blockquote[data-c="1"] { --hc: var(--c1); }
  mark.ul[data-c="2"], .ulitem blockquote[data-c="2"] { --hc: var(--c2); }
  .ulitem blockquote { border-left: 4px solid var(--hc, var(--line)); padding-left: 10px; }

  .fab {
    position: fixed; right: calc(10px + env(safe-area-inset-right, 0px)); top: 38%; transform: translateY(-50%);
    z-index: 8; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); cursor: pointer; display: grid; place-items: center;
    box-shadow: 0 2px 10px rgba(0,0,0,.18);
  }
  .fab svg { width: 22px; height: 22px; fill: currentColor; }
  .fab.has-sel::after {
    content: ""; position: absolute; top: 5px; right: 5px; width: 10px; height: 10px;
    border-radius: 50%; background: var(--accent);
  }
  .tools .tool { text-align: left; }
  .swatches { display: flex; align-items: center; gap: 12px; padding: 2px 2px 4px; }
  .sw { width: 36px; height: 36px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; box-shadow: inset 0 0 0 2px var(--surface); }
  .sw[data-c="0"] { background: var(--c0); }
  .sw[data-c="1"] { background: var(--c1); }
  .sw[data-c="2"] { background: var(--c2); }
  .sw[aria-pressed="true"] { border-color: var(--ink); }
  .ulitem { border-top: 1px solid var(--line); padding: 10px 0; }
  .ulitem blockquote { margin: 0 0 4px; font-family: var(--read); font-size: 1rem; line-height: 1.55; overflow-wrap: anywhere; }
  .ulitem .meta { color: var(--muted); font-size: .8rem; }
  .ulact { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }

  /* Barra de control */
  .player {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  }
  .player-in { max-width: 760px; margin: 0 auto; display: grid; gap: 10px; }
  .progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .row { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .ctl {
    width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--bg); cursor: pointer; display: grid; place-items: center;
  }
  .ctl svg { width: 22px; height: 22px; fill: currentColor; }
  .ctl.main { width: 58px; height: 58px; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .ctl.main svg { width: 28px; height: 28px; }
  .ctl:disabled { opacity: .4; cursor: not-allowed; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
  .opts label { display: grid; gap: 2px; font-size: .8rem; color: var(--muted); min-width: 0; }
  .opts select, .opts input[type=range] { width: 100%; min-width: 0; }
  .opts select {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px;
  }
  .opts input[type=range] { accent-color: var(--accent); }
  .warn { font-size: .85rem; color: var(--danger); text-align: center; margin: 0; }

  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <h1>Lector de PDF en voz alta</h1>
  <button class="ghost" id="themeBtn" type="button" aria-label="Cambiar tema claro u oscuro">Tema</button>
</header>

<main>
  <section id="loader">
    <div class="drop" id="drop">
      <strong>Abre un PDF para escucharlo</strong>
      <p>Arrastra el archivo aquí o elígelo desde tu dispositivo. El archivo no sale de tu navegador.</p>
      <button class="btn" id="pick" type="button">Elegir PDF</button>
      <input type="file" id="file" accept="application/pdf,.pdf" hidden>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <button class="ghost" id="forget" type="button" hidden>Olvidar el documento guardado en este dispositivo</button>
  </section>

  <section id="doc" hidden>
    <div class="docbar">
      <span class="docname" id="docname"></span>
      <span class="pageinfo" id="pageinfo"></span>
    </div>
    <div class="resume" id="resume" hidden>
      <span id="resumeMsg"></span>
      <button class="ghost" id="restart" type="button">Empezar de cero</button>
    </div>
    <div class="stats">
      <div class="stat">
        <span class="k">Hojas del documento</span>
        <span class="v" id="sheets">0</span>
      </div>
      <div class="stat" role="progressbar" aria-label="Porcentaje de lectura" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="pctBox">
        <span class="k">Lectura completada</span>
        <span class="v" id="pct">0%</span>
        <div class="mini"><i id="pctBar"></i></div>
      </div>
    </div>
    <button class="fab" id="ulFab" type="button" aria-label="Herramientas de subrayado" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
    </button>
    <div class="tools" id="ulMenu" role="group" aria-label="Herramientas de subrayado" hidden>
      <div class="swatches" role="group" aria-label="Color del subrayado">
        <button class="sw" type="button" data-c="0" aria-label="Amarillo" aria-pressed="true"></button>
        <button class="sw" type="button" data-c="1" aria-label="Verde" aria-pressed="false"></button>
        <button class="sw" type="button" data-c="2" aria-label="Rosa" aria-pressed="false"></button>
      </div>
      <button class="tool" id="ulAdd" type="button" disabled>Subrayar selección</button>
      <button class="tool" id="ulSent" type="button">Subrayar frase actual</button>
      <button class="tool" id="ulDel" type="button" disabled>Quitar subrayado</button>
      <button class="tool" id="ulList" type="button" aria-expanded="false">Subrayados (0)</button>
    </div>
    <section class="ulpanel" id="ulPanel" hidden>
      <div class="phead"><h2>Texto subrayado</h2><button class="tool" id="ulClose" type="button" aria-label="Cerrar la lista">Cerrar</button></div>
      <div id="ulItems"></div>
      <div class="ulact">
        <button class="tool" id="ulCopy" type="button">Copiar todo</button>
        <span class="pageinfo" id="ulMsg" role="status"></span>
      </div>
    </section>
    <article id="text" aria-label="Texto de la página"></article>
  </section>
</main>

<div class="player" id="player" hidden>
  <div class="player-in">
    <div class="progress" aria-hidden="true"><i id="bar"></i></div>
    <p class="warn" id="warn" hidden></p>
    <div class="row">
      <button class="ctl" id="prevPage" type="button" aria-label="Página anterior">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM20 6v12L9.5 12z"/></svg>
      </button>
      <button class="ctl" id="prevS" type="button" aria-label="Frase anterior">
        <svg viewBox="0 0 24 24"><path d="M15.5 5.5 8 12l7.5 6.5z"/></svg>
      </button>
      <button class="ctl main" id="play" type="button" aria-label="Reproducir">
        <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctl" id="nextS" type="button" aria-label="Frase siguiente">
        <svg viewBox="0 0 24 24"><path d="M8.5 5.5 16 12l-7.5 6.5z"/></svg>
      </button>
      <button class="ctl" id="nextPage" type="button" aria-label="Página siguiente">
        <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4 6l10.5 6L4 18z"/></svg>
      </button>
    </div>
    <div class="opts">
      <label>Voz
        <select id="voice"></select>
      </label>
      <label>Velocidad: <span id="rateVal">1.0×</span>
        <input type="range" id="rate" min="0.6" max="2" step="0.1" value="1">
      </label>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function () {
  "use strict";

  /* ---------- Referencias ---------- */
  const $ = (id) => document.getElementById(id);
  const el = {
    drop: $("drop"), file: $("file"), pick: $("pick"), status: $("status"),
    loader: $("loader"), doc: $("doc"), docname: $("docname"), pageinfo: $("pageinfo"),
    text: $("text"), player: $("player"), bar: $("bar"), warn: $("warn"),
    play: $("play"), playIcon: $("playIcon"), prevS: $("prevS"), nextS: $("nextS"),
    prevPage: $("prevPage"), nextPage: $("nextPage"), voice: $("voice"),
    rate: $("rate"), rateVal: $("rateVal"), themeBtn: $("themeBtn"),
    sheets: $("sheets"), pct: $("pct"), pctBar: $("pctBar"), pctBox: $("pctBox"),
    resume: $("resume"), resumeMsg: $("resumeMsg"), restart: $("restart"),
    ulAdd: $("ulAdd"), ulSent: $("ulSent"), ulDel: $("ulDel"), ulList: $("ulList"),
    ulPanel: $("ulPanel"), ulItems: $("ulItems"), ulCopy: $("ulCopy"), ulMsg: $("ulMsg"),
    ulFab: $("ulFab"), ulMenu: $("ulMenu"), ulClose: $("ulClose"), forget: $("forget")
  };

  const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
  const ICON_PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';

  /* ---------- Estado ---------- */
  const state = {
    pdf: null, name: "", page: 1, pages: 0,
    sentences: [],      // frases de la página actual
    spans: [],
    idx: 0,
    playing: false,
    token: 0,           // invalida callbacks antiguos
    cache: new Map(), ul: {}, key: "", color: 0    // página -> frases
  };

  /* ---------- Tema ---------- */
  el.themeBtn.addEventListener("click", () => {
    const root = document.documentElement;
    const dark = root.dataset.theme === "dark" ||
      (!root.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
    root.dataset.theme = dark ? "light" : "dark";
  });

  /* ---------- Mensajes ---------- */
  function setStatus(msg, isErr) {
    el.status.textContent = msg || "";
    el.status.classList.toggle("err", !!isErr);
  }

  /* ---------- Carga del PDF ---------- */
  let workerReady = Promise.resolve();
  if (!window.pdfjsLib) {
    setStatus("No se pudo cargar el lector de PDF. Comprueba tu conexión y recarga la página.", true);
  } else {
    const WORKER_URL = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    pdfjsLib.GlobalWorkerOptions.workerSrc = WORKER_URL;
    // Un navegador normal bloquea workers de otro dominio: se descarga el script
    // y se ejecuta desde un blob local. Si falla, PDF.js usa su modo de respaldo.
    workerReady = fetch(WORKER_URL)
      .then((r) => (r.ok ? r.text() : Promise.reject(new Error("worker"))))
      .then((code) => {
        pdfjsLib.GlobalWorkerOptions.workerSrc =
          URL.createObjectURL(new Blob([code], { type: "text/javascript" }));
      })
      .catch(() => { /* se queda con la URL original */ });
  }

  el.pick.addEventListener("click", () => el.file.click());
  el.file.addEventListener("change", () => { if (el.file.files[0]) openFile(el.file.files[0]); });
  ["dragenter", "dragover"].forEach((ev) => el.drop.addEventListener(ev, (e) => {
    e.preventDefault(); el.drop.classList.add("over");
  }));
  ["dragleave", "drop"].forEach((ev) => el.drop.addEventListener(ev, (e) => {
    e.preventDefault(); el.drop.classList.remove("over");
  }));
  el.drop.addEventListener("drop", (e) => {
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) openFile(f);
  });

  async function openFile(file) {
    if (!/\.pdf$/i.test(file.name) && file.type !== "application/pdf") {
      setStatus("Ese archivo no es un PDF. Elige un archivo con extensión .pdf.", true);
      return;
    }
    stop();
    setStatus("Abriendo el documento…");
    try {
      const buf = await file.arrayBuffer();
      await loadDocument(buf, file.name, file.size, true);
    } catch (err) {
      showOpenError(err);
    }
  }

  async function loadDocument(buf, name, size, persist) {
    await workerReady;
    // PDF.js consume el buffer; se guarda una copia para recuperarlo después
    const copy = persist ? buf.slice(0) : null;
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    state.pdf = pdf;
    state.name = name;
    state.pages = pdf.numPages;
    state.cache.clear();
    state.key = name + "|" + size + "|" + pdf.numPages;
    state.ul = loadUl();
    updateUlCount();
    closePanel();
    el.docname.textContent = name;
    el.sheets.textContent = pdf.numPages;
    el.doc.hidden = false;
    el.player.hidden = false;
    el.forget.hidden = false;
    el.drop.querySelector("strong").textContent = "Abrir otro PDF";
    setStatus("");
    const saved = loadPos();
    if (saved && saved.page >= 1 && saved.page <= state.pages && (saved.page > 1 || saved.idx > 0)) {
      await showPage(saved.page, saved.idx);
      showResume();
    } else {
      hideResume();
      await showPage(1);
    }
    if (persist) {
      saveLastPdf({ name, size, data: copy });
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    }
  }

  function showOpenError(err) {
    console.error(err);
    const pwd = err && err.name === "PasswordException";
    setStatus(pwd
      ? "Este PDF está protegido con contraseña. Quítala e inténtalo de nuevo."
      : "No se pudo leer el PDF. Puede estar dañado; prueba con otro archivo.", true);
  }

  /* ---------- Guardar el último PDF en este navegador ---------- */
  function idb() {
    return new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error("sin IndexedDB"));
      const q = indexedDB.open("lectorpdf", 1);
      q.onupgradeneeded = () => q.result.createObjectStore("files");
      q.onsuccess = () => res(q.result);
      q.onerror = () => rej(q.error);
    });
  }
  async function saveLastPdf(rec) {
    try {
      const db = await idb();
      await new Promise((res, rej) => {
        const tx = db.transaction("files", "readwrite");
        tx.objectStore("files").put(rec, "last");
        tx.oncomplete = res;
        tx.onerror = tx.onabort = () => rej(tx.error);
      });
      db.close();
    } catch (e) { /* sin espacio o sin permiso: la app sigue funcionando */ }
  }
  async function loadLastPdf() {
    try {
      const db = await idb();
      const rec = await new Promise((res, rej) => {
        const r = db.transaction("files").objectStore("files").get("last");
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
      db.close();
      return rec || null;
    } catch (e) { return null; }
  }
  async function deleteLastPdf() {
    try {
      const db = await idb();
      await new Promise((res, rej) => {
        const tx = db.transaction("files", "readwrite");
        tx.objectStore("files").delete("last");
        tx.oncomplete = res;
        tx.onerror = tx.onabort = () => rej(tx.error);
      });
      db.close();
    } catch (e) { /* nada */ }
  }
  async function restoreLast() {
    const rec = await loadLastPdf();
    if (!rec || !rec.data) return;
    setStatus("Recuperando «" + rec.name + "»…");
    try {
      await loadDocument(rec.data, rec.name, rec.size, false);
    } catch (e) {
      setStatus("");
    }
  }
  el.forget.addEventListener("click", async () => {
    await deleteLastPdf();
    el.forget.hidden = true;
    setStatus("Listo: el PDF ya no está guardado en este dispositivo. Tus subrayados y tu posición se conservan.");
  });

  /* ---------- Extracción de texto ---------- */
  async function extractPage(n) {
    if (state.cache.has(n)) return state.cache.get(n);
    const page = await state.pdf.getPage(n);
    const content = await page.getTextContent();

    // Agrupar en líneas por posición vertical
    const lines = [];
    let cur = null;
    for (const it of content.items) {
      if (!it.str && !it.hasEOL) continue;
      const y = it.transform[5];
      const h = Math.abs(it.transform[3]) || it.height || 10;
      if (cur && Math.abs(cur.y - y) < h * 0.5) {
        cur.text += it.str;
      } else {
        cur = { y, h, text: it.str };
        lines.push(cur);
      }
    }

    // Unir líneas en párrafos según el espacio entre ellas
    const paragraphs = [];
    let buf = "";
    let prev = null;
    for (const ln of lines) {
      const t = ln.text.replace(/\s+/g, " ").trim();
      if (!t) continue;
      const gap = prev ? Math.abs(prev.y - ln.y) : 0;
      const newPara = prev && gap > prev.h * 1.9;
      if (newPara) { paragraphs.push(buf); buf = ""; }
      if (buf.endsWith("-") && /[a-záéíóúüñ]$/i.test(buf.slice(0, -1))) buf = buf.slice(0, -1) + t;
      else buf = buf ? buf + " " + t : t;
      prev = ln;
    }
    if (buf) paragraphs.push(buf);

    const result = paragraphs.map(splitSentences).filter((p) => p.length);
    state.cache.set(n, result);
    return result;
  }

  function splitSentences(par) {
    const parts = par.match(/[^.!?…¡¿]*[.!?…]+["'”»)\]]*\s*|[^.!?…]+$/g) || [par];
    const out = [];
    for (const p of parts) {
      const s = p.trim();
      if (!s) continue;
      // Evitar cortar en abreviaturas o números como "Sr." o "3."
      if (out.length && (/\b(?:Sr|Sra|Dr|Dra|Lic|Ing|etc|pág|art|núm|No|Vs|vs)\.$/.test(out[out.length - 1]) || /(^|\s)\d+\.$/.test(out[out.length - 1]))) {
        out[out.length - 1] += " " + s;
      } else out.push(s);
    }
    return out;
  }

  /* ---------- Mostrar página ---------- */
  async function showPage(n, startIdx) {
    state.page = n;
    el.pageinfo.textContent = "Página " + n + " de " + state.pages;
    el.prevPage.disabled = n <= 1;
    el.nextPage.disabled = n >= state.pages;
    el.text.innerHTML = '<p class="empty">Leyendo la página…</p>';
    const paras = await extractPage(n);
    if (n !== state.page) return;

    el.text.textContent = "";
    state.sentences = [];
    state.spans = [];
    if (!paras.length) {
      el.text.innerHTML = '<p class="empty">Esta página no tiene texto seleccionable. ' +
        'Si el PDF es un documento escaneado (imágenes), este lector no puede leerlo todavía: ' +
        'necesita pasar antes por un programa de reconocimiento de texto (OCR).</p>';
      checkScanned();
      updateProgress();
      return;
    }
    warn("");
    for (const sents of paras) {
      const p = document.createElement("p");
      sents.forEach((s, i) => {
        const span = document.createElement("span");
        span.className = "s";
        span.textContent = s + (i < sents.length - 1 ? " " : "");
        const k = state.sentences.length;
        span.addEventListener("click", () => {
          if (String(window.getSelection()).length) return; // seleccionando texto, no saltar
          jumpTo(k, true);
        });
        p.appendChild(span);
        state.sentences.push(s);
        state.spans.push(span);
      });
      el.text.appendChild(p);
    }
    state.idx = Math.min(startIdx || 0, state.sentences.length - 1);
    applyUnderlines();
    mark();
    updateProgress();
    window.scrollTo({ top: 0 });
  }

  async function checkScanned() {
    // Si ninguna de las primeras páginas tiene texto, avisar
    const limit = Math.min(state.pages, 3);
    for (let i = 1; i <= limit; i++) {
      const p = await extractPage(i);
      if (p.length) return;
    }
    warn("Este PDF parece escaneado (solo imágenes): no se puede leer en voz alta sin OCR.");
  }
  /* ---------- Subrayado ---------- */
  let pending = null, pendingTimer = null, panelTok = 0, msgTimer = null;

  function ulKey() { return 'lectorpdf-ul:' + state.key; }
  function saveUl() {
    try { localStorage.setItem(ulKey(), JSON.stringify(state.ul)); } catch (e) { /* sin almacenamiento */ }
  }
  function loadUl() {
    try {
      const r = localStorage.getItem(ulKey());
      const o = r ? JSON.parse(r) : {};
      if (!o || typeof o !== 'object') return {};
      Object.keys(o).forEach((k) => { o[k] = (o[k] || []).map((r) => [r[0], r[1], r[2] || 0]); });
      return o;
    } catch (e) { return {}; }
  }
  function ulTotal() { return Object.values(state.ul).reduce((a, l) => a + l.length, 0); }
  function updateUlCount() { el.ulList.textContent = 'Ver subrayados (' + ulTotal() + ')'; }

  function mergeRanges(list) {
    const sorted = list.filter((r) => r[1] > r[0]).sort((a, b) => a[0] - b[0]);
    const out = [];
    for (const r of sorted) {
      const last = out[out.length - 1];
      if (last && r[0] <= last[1] && last[2] === r[2]) last[1] = Math.max(last[1], r[1]);
      else out.push([r[0], r[1], r[2] || 0]);
    }
    return out;
  }
  function addRange(page, s, e, c) {
    removeRange(page, s, e);
    state.ul[page] = mergeRanges((state.ul[page] || []).concat([[s, e, c === undefined ? state.color : c]]));
  }
  function removeRange(page, s, e) {
    const out = [];
    for (const [a, b, c] of state.ul[page] || []) {
      if (e <= a || s >= b) { out.push([a, b, c]); continue; }
      if (s > a) out.push([a, s, c]);
      if (e < b) out.push([e, b, c]);
    }
    if (out.length) state.ul[page] = out; else delete state.ul[page];
  }

  function pageText(paras) {
    return paras.map((sents) => sents.map((s, i) => s + (i < sents.length - 1 ? ' ' : '')).join('')).join('');
  }

  function clearMarks() {
    el.text.querySelectorAll('mark.ul').forEach((m) => m.replaceWith(...m.childNodes));
    el.text.normalize();
  }
  function wrapRange(s, e, c) {
    const w = document.createTreeWalker(el.text, NodeFilter.SHOW_TEXT);
    const nodes = [];
    let pos = 0, n;
    while ((n = w.nextNode())) {
      const len = n.nodeValue.length;
      if (pos + len > s && pos < e) nodes.push({ n, pos });
      pos += len;
      if (pos >= e) break;
    }
    nodes.forEach(({ n, pos }) => {
      const len = n.nodeValue.length;
      const a = Math.max(s - pos, 0), b = Math.min(e - pos, len);
      let t = n;
      if (a > 0) t = t.splitText(a);
      if (b - a < t.nodeValue.length) t.splitText(b - a);
      const m = document.createElement('mark');
      m.className = 'ul';
      m.dataset.c = c || 0;
      t.parentNode.insertBefore(m, t);
      m.appendChild(t);
    });
  }
  function applyUnderlines() {
    clearMarks();
    (state.ul[state.page] || []).forEach(([s, e, c]) => wrapRange(s, e, c));
    setPending(null);
    updateUlCount();
  }

  function offsetOf(container, off) {
    const r = document.createRange();
    r.selectNodeContents(el.text);
    r.setEnd(container, off);
    return r.toString().length;
  }
  function selectionOffsets() {
    const sel = window.getSelection();
    if (!sel || !sel.rangeCount || sel.isCollapsed) return null;
    const r = sel.getRangeAt(0);
    if (!el.text.contains(r.startContainer) || !el.text.contains(r.endContainer)) return null;
    let s = offsetOf(r.startContainer, r.startOffset);
    let e = offsetOf(r.endContainer, r.endOffset);
    const txt = el.text.textContent;
    while (s < e && /\s/.test(txt[s])) s++;
    while (e > s && /\s/.test(txt[e - 1])) e--;
    return e > s ? [s, e] : null;
  }

  function setPending(p) {
    pending = p;
    el.ulAdd.disabled = !p;
    el.ulDel.disabled = !p;
    el.ulFab.classList.toggle('has-sel', !!p);
  }
  document.addEventListener('selectionchange', () => {
    const o = selectionOffsets();
    clearTimeout(pendingTimer);
    if (o) setPending({ page: state.page, s: o[0], e: o[1] });
    else if (pending && el.ulMenu.hidden) pendingTimer = setTimeout(() => setPending(null), 1500);
  });
  // Evitar que pulsar un botón borre la selección
  [el.ulAdd, el.ulDel, el.ulSent, el.ulFab, ...document.querySelectorAll('.sw')]
    .forEach((b) => b.addEventListener('mousedown', (e) => e.preventDefault()));

  function afterChange() {
    saveUl();
    const sel = window.getSelection();
    if (sel) sel.removeAllRanges();
    applyUnderlines();
    if (!el.ulPanel.hidden) renderPanel();
    closeMenu();
  }

  el.ulAdd.addEventListener('click', () => {
    if (!pending || pending.page !== state.page) return;
    addRange(pending.page, pending.s, pending.e);
    afterChange();
  });
  el.ulDel.addEventListener('click', () => {
    if (!pending || pending.page !== state.page) return;
    removeRange(pending.page, pending.s, pending.e);
    afterChange();
  });
  el.ulSent.addEventListener('click', () => {
    const sp = state.spans[state.idx];
    if (!sp) return;
    const s = offsetOf(sp, 0);
    const e = s + sp.textContent.trimEnd().length;
    const covered = (state.ul[state.page] || []).some((r) => r[0] <= s && r[1] >= e && r[2] === state.color);
    if (covered) removeRange(state.page, s, e); else addRange(state.page, s, e);
    afterChange();
  });

  /* Menú flotante (tres puntos) */
  function openMenu() {
    clearTimeout(pendingTimer);
    el.ulMenu.hidden = false;
    el.ulFab.setAttribute('aria-expanded', 'true');
  }
  function closeMenu() {
    el.ulMenu.hidden = true;
    el.ulFab.setAttribute('aria-expanded', 'false');
    if (pending && !selectionOffsets()) {
      clearTimeout(pendingTimer);
      pendingTimer = setTimeout(() => setPending(null), 1500);
    }
  }
  el.ulFab.addEventListener('click', () => { if (el.ulMenu.hidden) openMenu(); else closeMenu(); });
  document.addEventListener('pointerdown', (e) => {
    if (!el.ulMenu.hidden && !el.ulMenu.contains(e.target) && !el.ulFab.contains(e.target)) closeMenu();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeMenu(); closePanel(); }
  });
  document.querySelectorAll('.sw').forEach((b) => b.addEventListener('click', () => {
    state.color = Number(b.dataset.c);
    document.querySelectorAll('.sw').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    try { localStorage.setItem('lectorpdf-color', String(state.color)); } catch (err) { /* nada */ }
  }));
  try {
    const saved = parseInt(localStorage.getItem('lectorpdf-color'), 10);
    if (saved >= 0 && saved <= 2) {
      state.color = saved;
      document.querySelectorAll('.sw').forEach((x) => x.setAttribute('aria-pressed', String(Number(x.dataset.c) === saved)));
    }
  } catch (err) { /* nada */ }
  el.ulClose.addEventListener('click', () => closePanel());

  /* Panel de subrayados */
  function closePanel() {
    el.ulPanel.hidden = true;
    el.ulList.setAttribute('aria-expanded', 'false');
  }
  el.ulList.addEventListener('click', () => {
    const open = el.ulPanel.hidden;
    el.ulPanel.hidden = !open;
    el.ulList.setAttribute('aria-expanded', String(open));
    if (open) { renderPanel(); closeMenu(); }
  });

  function sentenceIndexAt(paras, offset) {
    let pos = 0, k = 0;
    for (const sents of paras) {
      for (let i = 0; i < sents.length; i++) {
        const len = sents[i].length + (i < sents.length - 1 ? 1 : 0);
        if (offset < pos + len) return k;
        pos += len; k++;
      }
    }
    return Math.max(0, k - 1);
  }
  function scrollToOffset(offset) {
    const w = document.createTreeWalker(el.text, NodeFilter.SHOW_TEXT);
    let pos = 0, n;
    while ((n = w.nextNode())) {
      const len = n.nodeValue.length;
      if (offset < pos + len) { n.parentElement.scrollIntoView({ block: 'center' }); return; }
      pos += len;
    }
  }

  async function renderPanel() {
    const my = ++panelTok;
    const pages = Object.keys(state.ul).map(Number).sort((a, b) => a - b);
    const frag = document.createDocumentFragment();
    if (!pages.length) {
      const p = document.createElement('p');
      p.className = 'empty';
      p.textContent = 'Aún no has subrayado nada. Selecciona un texto y pulsa «Subrayar selección», o subraya la frase que estás escuchando.';
      frag.appendChild(p);
    }
    for (const pg of pages) {
      const paras = await extractPage(pg);
      const text = pageText(paras);
      for (const [s, e, c] of state.ul[pg] || []) {
        const item = document.createElement('div');
        item.className = 'ulitem';
        const q = document.createElement('blockquote');
        q.textContent = text.slice(s, e);
        q.dataset.c = c || 0;
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = 'Página ' + pg;
        const act = document.createElement('div');
        act.className = 'ulact';
        const go = document.createElement('button');
        go.type = 'button'; go.className = 'tool'; go.textContent = 'Ir al texto';
        go.addEventListener('click', async () => {
          pause();
          closePanel();
          await showPage(pg, sentenceIndexAt(paras, s));
          scrollToOffset(s);
        });
        const del = document.createElement('button');
        del.type = 'button'; del.className = 'tool'; del.textContent = 'Borrar';
        del.addEventListener('click', () => {
          removeRange(pg, s, e);
          saveUl();
          if (pg === state.page) applyUnderlines();
          updateUlCount();
          renderPanel();
        });
        act.append(go, del);
        item.append(q, meta, act);
        frag.appendChild(item);
      }
    }
    if (my === panelTok) el.ulItems.replaceChildren(frag);
  }

  function ulMessage(msg) {
    el.ulMsg.textContent = msg;
    clearTimeout(msgTimer);
    msgTimer = setTimeout(() => { el.ulMsg.textContent = ''; }, 3000);
  }
  el.ulCopy.addEventListener('click', async () => {
    const pages = Object.keys(state.ul).map(Number).sort((a, b) => a - b);
    const out = [];
    for (const pg of pages) {
      const text = pageText(await extractPage(pg));
      for (const [s, e] of state.ul[pg]) out.push('Pág. ' + pg + ': ' + text.slice(s, e));
    }
    if (!out.length) { ulMessage('No hay nada que copiar.'); return; }
    const all = out.join('\n\n');
    try {
      await navigator.clipboard.writeText(all);
      ulMessage('Copiado.');
    } catch (err) {
      try {
        const ta = document.createElement('textarea');
        ta.value = all;
        ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        ta.remove();
        ulMessage(ok ? 'Copiado.' : 'No se pudo copiar.');
      } catch (e2) { ulMessage('No se pudo copiar.'); }
    }
  });

  /* ---------- Retomar lectura ---------- */
  function posKey() { return "lectorpdf:" + state.key; }
  function savePos() {
    if (!state.key || !state.sentences.length) return;
    try {
      localStorage.setItem(posKey(), JSON.stringify({ page: state.page, idx: state.idx, t: Date.now() }));
    } catch (e) { /* almacenamiento no disponible */ }
  }
  function loadPos() {
    try {
      const raw = localStorage.getItem(posKey());
      const p = raw ? JSON.parse(raw) : null;
      return p && typeof p.page === "number" && typeof p.idx === "number" ? p : null;
    } catch (e) { return null; }
  }
  function clearPos() {
    try { localStorage.removeItem(posKey()); } catch (e) { /* nada */ }
  }
  function hideResume() { el.resume.hidden = true; }
  function showResume() {
    const total = state.sentences.length || 1;
    const pct = Math.round(((state.page - 1 + state.idx / total) / state.pages) * 100);
    el.resumeMsg.textContent = "Continúas en la página " + state.page + " de " + state.pages +
      " (" + pct + " % leído). Pulsa reproducir para seguir donde lo dejaste.";
    el.resume.hidden = false;
    const s = state.spans[state.idx];
    if (s) s.scrollIntoView({ block: "center" });
  }
  el.restart.addEventListener("click", async () => {
    stop();
    clearPos();
    hideResume();
    await showPage(1, 0);
  });

  function showPct(pct) {
    const v = Math.max(0, Math.min(100, Math.round(pct)));
    el.pct.textContent = v + "%";
    el.pctBar.style.width = v + "%";
    el.pctBox.setAttribute("aria-valuenow", v);
  }
  function warn(msg) { el.warn.hidden = !msg; el.warn.textContent = msg || ""; }

  function mark() {
    state.spans.forEach((s, i) => s.classList.toggle("now", i === state.idx));
    const s = state.spans[state.idx];
    if (s && state.playing) s.scrollIntoView({ block: "center", behavior: "smooth" });
  }

  function updateProgress() {
    const total = state.sentences.length || 1;
    const pageFrac = state.sentences.length ? state.idx / total : 0;
    const pct = state.pages ? ((state.page - 1 + pageFrac) / state.pages) * 100 : 0;
    el.bar.style.width = pct.toFixed(1) + "%";
    showPct(pct);
    savePos();
  }

  /* ---------- Voz ---------- */
  const synth = window.speechSynthesis;
  let voices = [];

  function loadVoices() {
    if (!synth) return;
    voices = synth.getVoices();
    if (!voices.length) return;
    const prevSel = el.voice.value;
    const lang = (navigator.language || "es").slice(0, 2).toLowerCase();
    const sorted = voices.slice().sort((a, b) => {
      const sa = a.lang.toLowerCase().startsWith(lang) ? 0 : (a.lang.toLowerCase().startsWith("es") ? 1 : 2);
      const sb = b.lang.toLowerCase().startsWith(lang) ? 0 : (b.lang.toLowerCase().startsWith("es") ? 1 : 2);
      return sa - sb || a.name.localeCompare(b.name);
    });
    el.voice.innerHTML = "";
    sorted.forEach((v) => {
      const o = document.createElement("option");
      o.value = v.voiceURI;
      o.textContent = v.name + " (" + v.lang + ")";
      el.voice.appendChild(o);
    });
    if (prevSel && sorted.some((v) => v.voiceURI === prevSel)) el.voice.value = prevSel;
  }
  if (!synth) {
    warn("Tu navegador no admite lectura en voz alta. Prueba con Chrome, Edge o Safari.");
    el.play.disabled = true;
  } else {
    loadVoices();
    synth.addEventListener("voiceschanged", loadVoices);
  }

  el.rate.addEventListener("input", () => {
    el.rateVal.textContent = parseFloat(el.rate.value).toFixed(1) + "×";
  });

  function setPlaying(on) {
    state.playing = on;
    el.playIcon.innerHTML = on ? ICON_PAUSE : ICON_PLAY;
    el.play.setAttribute("aria-label", on ? "Pausar" : "Reproducir");
  }

  function speakCurrent() {
    if (!synth || !state.playing) return;
    const text = state.sentences[state.idx];
    if (!text) return;
    const myToken = ++state.token;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = voices.find((x) => x.voiceURI === el.voice.value);
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = navigator.language || "es-ES";
    u.rate = parseFloat(el.rate.value);
    u.onend = () => { if (myToken === state.token && state.playing) advance(); };
    u.onerror = (e) => {
      if (myToken !== state.token) return;
      if (e.error === "interrupted" || e.error === "canceled") return;
      setPlaying(false);
      warn("No se pudo reproducir la voz seleccionada. Prueba con otra voz.");
    };
    mark();
    updateProgress();
    // Pequeño margen: algunos navegadores ignoran speak() justo tras cancel()
    setTimeout(() => { if (myToken === state.token && state.playing) synth.speak(u); }, 40);
  }

  async function advance() {
    if (state.idx < state.sentences.length - 1) {
      state.idx++;
      speakCurrent();
    } else if (state.page < state.pages) {
      await showPage(state.page + 1, 0);
      if (state.playing) speakCurrent();
    } else {
      stop();
      state.idx = 0;
      mark();
      el.bar.style.width = "100%";
      showPct(100);
      clearPos();
    }
  }

  function play() {
    if (!state.sentences.length) return;
    setPlaying(true);
    speakCurrent();
  }
  function pause() {
    state.token++;
    setPlaying(false);
    if (synth) synth.cancel();
  }
  function stop() {
    state.token++;
    setPlaying(false);
    if (synth) synth.cancel();
  }

  function jumpTo(i, autoplay) {
    if (!state.sentences.length) return;
    state.idx = Math.max(0, Math.min(i, state.sentences.length - 1));
    mark();
    updateProgress();
    if (autoplay || state.playing) { setPlaying(true); speakCurrent(); }
  }

  /* ---------- Controles ---------- */
  el.play.addEventListener("click", () => (state.playing ? pause() : play()));

  el.prevS.addEventListener("click", async () => {
    if (state.idx > 0) return jumpTo(state.idx - 1);
    if (state.page > 1) {
      const was = state.playing;
      const prev = await extractPage(state.page - 1);
      const count = prev.reduce((a, p) => a + p.length, 0);
      await showPage(state.page - 1, Math.max(0, count - 1));
      if (was) { setPlaying(true); speakCurrent(); }
    }
  });
  el.nextS.addEventListener("click", async () => {
    if (state.idx < state.sentences.length - 1) return jumpTo(state.idx + 1);
    if (state.page < state.pages) {
      const was = state.playing;
      await showPage(state.page + 1, 0);
      if (was) { setPlaying(true); speakCurrent(); }
    }
  });
  el.prevPage.addEventListener("click", async () => {
    if (state.page <= 1) return;
    const was = state.playing;
    if (was) { state.token++; synth.cancel(); }
    await showPage(state.page - 1, 0);
    if (was) { setPlaying(true); speakCurrent(); }
  });
  el.nextPage.addEventListener("click", async () => {
    if (state.page >= state.pages) return;
    const was = state.playing;
    if (was) { state.token++; synth.cancel(); }
    await showPage(state.page + 1, 0);
    if (was) { setPlaying(true); speakCurrent(); }
  });

  // Cambiar de voz mientras se lee: continúa con la nueva voz
  el.voice.addEventListener("change", () => { if (state.playing) speakCurrent(); });

  document.addEventListener("keydown", (e) => {
    if (e.target.matches("select, input, button")) return;
    if (e.code === "Space" && state.sentences.length) { e.preventDefault(); el.play.click(); }
  });

  window.addEventListener("pagehide", () => { savePos(); if (synth) synth.cancel(); });

  // Al abrir la app, recuperar el último PDF para seguir donde se dejó
  if (window.pdfjsLib) restoreLast();
})();
</script>
</body>
</html>
